[project]
name = "crypto-hunter-api"
version = "0.1.0"
description = "Crypto Hunter backend: per-chain token screening and report factory"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  # GMGN fingerprints TLS: httpx gets 403, a Chrome-impersonating client gets 200.
  # Measured 2026-09-24, see api/app/sources/SOURCES.md.
  "curl-cffi>=0.7",
  "tzdata>=2026.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
