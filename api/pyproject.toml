[project]
name = "crypto-hunter-api"
version = "0.1.0"
description = "Crypto Hunter backend: per-chain token screening and report factory"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  # pyyaml dumps a file and takes every comment with it. The chain files are read by
  # humans - each knob says why it is the number it is - and the write path (adding,
  # renaming and deleting a set of settings) has to round-trip them instead of
  # reformatting them. ruamel.yaml is pyyaml's round-trip half.
  "ruamel.yaml>=0.18",
  "httpx>=0.27",
  # GMGN fingerprints TLS: httpx gets 403, a Chrome-impersonating client gets 200.
  # Measured 2026-09-24, see api/app/sources/SOURCES.md.
  "curl-cffi>=0.7",
  # A site whose document arrives empty has to be drawn, and only a browser does that.
  # Measured 2026-09-27: three of the project sites this pipeline had already read came
  # back as eight to ten words with no address on them, and rendered into 377 to 600 words
  # with it. See api/app/sources/browser.py for why this is a fallback and not a lane.
  "playwright>=1.63",
  "tzdata>=2026.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
