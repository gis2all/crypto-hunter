# ---------------------------------------------------------------- query（1–5 + discovery）
# 2026-10-22：按机会族重建。每个 query 行带 family；旧 30 条由迁移禁用，不在这里重复。
query:
  # network
  - target: '("run a node" OR "run your own node" OR "node sale" OR "validator node" OR "become a validator" OR restaking) -is:retweet -is:reply -giveaway -giveaways -lottery -抽奖 -博彩 -赌博 -casino -betting -gambling -体育 -sports -sport -娱乐 -entertainment -游戏 -gaming -开户 -演唱会 -concert -AMA -交易大赛 -"trading competition" -链游 -gamefi -game-fi -playtoearn -play-to-earn -p2e -web3game -nftgame -game -games -raffle'
    kind: query
    family: network
    ecosystem: multi
    window_hours: 24
    slice_hours: 4
    max_results: 40
    enabled: true
    note: "2026-10-22 网络与安全：节点、验证者、sequencer、prover、restaking"
  - target: '(testnet OR devnet OR faucet) ("run a node" OR "validator node" OR "test transaction") -is:retweet -is:reply -giveaway -giveaways -lottery -抽奖 -博彩 -赌博 -casino -betting -gambling -体育 -sports -sport -娱乐 -entertainment -游戏 -gaming -开户 -演唱会 -concert -AMA -交易大赛 -"trading competition" -链游 -gamefi -game-fi -playtoearn -play-to-earn -p2e -web3game -nftgame -game -games -raffle'
    kind: query
    family: network
    ecosystem: multi
    window_hours: 24
    slice_hours: 4
    max_results: 40
    enabled: true
    note: "2026-10-22 网络与安全：测试网参与与 faucet"
  - target: '(测试网 OR 节点) (运行 OR 注册 OR 销售) -is:retweet -is:reply -giveaway -giveaways -lottery -抽奖 -博彩 -赌博 -casino -betting -gambling -体育 -sports -sport -娱乐 -entertainment -游戏 -gaming -开户 -演唱会 -concert -AMA -交易大赛 -"trading competition" -链游 -gamefi -game-fi -playtoearn -play-to-earn -p2e -web3game -nftgame -game -games -raffle'
    kind: query
    family: network
    ecosystem: multi
    window_hours: 24
    slice_hours: 4
    max_results: 40
    enabled: true
    note: "2026-10-22 网络与安全：中文节点/测试网"
  # capital
  - target: '("points program" OR "season 1" OR "season 2" OR APR OR APY) (deposit OR "provide liquidity" OR stake OR "open a vault" OR restake) -is:retweet -is:reply -giveaway -giveaways -lottery -抽奖 -博彩 -赌博 -casino -betting -gambling -体育 -sports -sport -娱乐 -entertainment -游戏 -gaming -开户 -演唱会 -concert -AMA -交易大赛 -"trading competition" -链游 -gamefi -game-fi -playtoearn -play-to-earn -p2e -web3game -nftgame -game -games -raffle'
    kind: query
    family: capital
    ecosystem: multi
    window_hours: 24
    slice_hours: 4
    max_results: 40
