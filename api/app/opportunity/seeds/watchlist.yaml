# 新机会 watchlist 种子（v1）
#
# 用途：首次运行时播种 opportunity_sources 表（对标 config/chains/*.example.yaml 的播种方式：
# 这份跟仓库，运行时那份在库里、由操作者增删）。字段对应表列：target / kind / ecosystem / note。
#
# 验证方式：official 类的 handle 全部用项目自己的 X 会话跑过 `twitter user <handle>` 确认存在；
# note 里的证据是「凭什么说它是官方」——优先取项目自己官网上的 X 链接，其次是简介里的自我声明。
# 验证日期 2026-10-18。handle 会改名（本轮抓到 Intract→FairDAO、Karak→OpenGDP、Axelar 迁移、
# EigenLayer→EigenCloud），所以这份清单要定期复核，改名是常态而不是异常。
#
# 2026-10-27：official 行默认 enabled: false —— 不再读时间线，只作为身份库（known）；
# 扫描只读 query 行。官网/文档刷新是下一步。
#
# 2026-10-27：query 行统一带排除词（交易大赛 / AMA / 抽奖 / 博彩 / 体育 / 娱乐 / 游戏 / 开户 /
# 演唱会，以及 giveaway / lottery / casino / betting / sports / entertainment / gaming /
# concert 等英文对应词），在 X 端先少占每片 40 条的名额；免费闸仍是第二层。

checked_at: 2026-10-18
checked_with: twitter user <handle> --json（项目自己的 X 会话）

