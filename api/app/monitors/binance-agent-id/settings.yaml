# Binance Agent ID 的查询、开关、节奏与采集参数；默认值在 monitors/registry.py。
enabled: true
schedule: true
interval_hours: 1
start_hour: 1
start_minute: 15
window_hours: 24
slice_hours: 4
min_score: 30
queries:
- '("agent id" OR agentid OR agent_id OR #agentid OR "agentic wallet" OR "agentic
  wallets") (mint OR minting OR minted OR whitelist OR allowlist OR presale OR "public
  sale" OR 铸造 OR 白名单 OR 预售 OR 公售) -is:retweet -is:reply -giveaway -lottery -casino
  -gambling -sports -entertainment -游戏 -派对 -AMA'
- '("agent id" OR agentid OR agent_id OR #agentid OR "agentic wallet" OR "agentic
  wallets") (quest OR quests OR points OR airdrop OR reward OR "check in" OR checkin
  OR 积分 OR 空投 OR 任务 OR 测试网 OR 白名单任务) -is:retweet -is:reply -giveaway -lottery -casino
  -gambling -sports -entertainment -游戏 -派对 -AMA'
