# 每条链的独立设定：节奏、过滤、评分、出口都属于链自己。
# 这个文件是「出厂默认」；「保存并生效」会写入 settings_versions 表，之后以表里的版本为准。
# 口径（分位分母 = 本轮硬过滤幸存者、淘汰数按优先级累计）见 CLAUDE.md 第二部分。
id: solana
# 链自己的名字（写进报告文字、搜索词、设定页口径），与 `label` 分开：那个是「雷达」的名字。
name: Solana
# 这条链的主线，一句话。f_narrative 只判「在不在主线上」，判据就是这句话（写进 research.md 的 __THESIS__）。
thesis: 链上零售交易的主场：meme 的发射与换手
label: Solana 雷达
enabled: true
explorer: https://solscan.io
# The chain own node. Nothing reads it yet on this chain - see the sources note below.
rpc: https://api.mainnet-beta.solana.com
configs:
  - id: default
    label: 默认配置
    enabled: true
    locked: true
    # 这是第一条非 EVM 链，能跑的只有通用源：GMGN 给换手榜、GeckoTerminal 给池子枚举，
    # DexScreener 按 CA 逐币补齐（它是 ENRICH_ONLY，不写在这里）。
    # solana_mint 是这条链自己的一个逐币读：mint 账户里的铸造权与冻结权（sources/solana/mint.py），
    # 它没有全链列表，所以只在「扫描源」之外挂着，不进 scan_sources。
    # 另外四个源跟不上，不是漏配：goplus / sourcify 的 chain id 表是 EVM 的，
    # blockscout 要一个 Blockscout 实例，onchain.py 的余额、bytecode 与 LP 读法整块是 EVM 的。
    # DexScreener 榜单（dexscreener_rank）给全链池面：没有发射台可枚举时，只有它认得这条链上正在交易的币。
    sources: [geckoterminal, gmgn, dexscreener_rank, solana_mint]
    schedule:
      interval_hours: 3
      start_hour: 2
      timezone: Asia/Shanghai
      push_delay_minutes: 6
    pipeline:
      scan_limit: 5000
      universe_holders_floor: 50
      scan_sources: [gmgn, geckoterminal, dexscreener_rank]
      # 判定跑整个幸存者池（0 = 全池）；链下调研另有 research_limit（0 = 全部调研）。
      gate_limit: 0
      research_limit: 20
      prefilter:
        # 阈值先照抄 Arc 那套，还没按 Solana 自己的分布校准过：
        # 这一版是为了看清通用源能捞回多少行，不是为了定这条链的口径。
        market_cap_min_usd: 10000
        market_cap_max_usd: 200000
        liquidity_min_usd: 5000
        volume_24h_min_usd: 1000
        holders_min: 100
        # 持有人上限，留空 = 不设上限。
        holders_max: null
        # 空壳淘汰: 市值与流动性同时缺失的行直接淘汰。
        require_market_data: true
        # 距高回撤：距历史最高点回撤 70% 以上即淘汰。
        drawdown_max_pct: -70
        top10_max_pct: 40
        bundling_max_pct: 25
        forbid_honeypot: true
        # 零数据淘汰: how many of the five ranking factors must carry a number once every
        # source has answered. 0 switches the rule off.
        min_scored_fields: 1
      safety:
        # 这条链上还没有源能回答「源码已验证」：GoPlus 的 Solana 端点字段与 EVM 完全不同，
        # Sourcify 只有 EVM。开着它只会给每一行盖一个「未判定」章，所以先关掉，
        # 等补上验证源再打开。
        require_verified_source: false
        source_verification_mode: dual
        lp_unjudged_passes: true
        # 危险权限在这条链上读的是 mint 账户的两个权限：铸造权没放弃就能继续增发，冻结权
        # 没放弃就能冻住任意账户（币卖不掉）。EVM 那三条读的是合约字节码，这条链上没有，
        # 所以这里是这两条。节点不答时留成「未判定」，不淘汰。
        forbid_dangerous_perms: [mint_authority, freeze_authority]
        honeypot_max_pct: 45
      scoring:
        onchain_weight: 55
        offchain_weight: 45
        onchain_factors: [liquidity, volume_24h, holders, top10_concentration, bundling]
        onchain_factor_weights:
          liquidity: 20
          volume_24h: 20
          holders: 20
          top10_concentration: 20
          bundling: 20
        offchain_factor_weights:
          f_completeness: 20
          f_substance: 20
          f_team: 20
          f_narrative: 20
          f_community: 20
    report:
      per_round: 5
      push_target: telegram
      push_content: [cards, table]
      rename_count_min: 2
      rename_count: true
      creator_token_count: true
      duplicate_symbol: true
      missing_socials: false
