# 每条链的独立设定：节奏、过滤、评分、出口都属于链自己。
# 这个文件是「出厂默认」；「保存并生效」会写入 settings_versions 表，之后以表里的版本为准。
# 口径（分位分母 = 本轮硬过滤幸存者、淘汰数按优先级累计）见 CLAUDE.md 第二部分。
id: arc
# 链自己的名字（写进报告文字、搜索词、设定页口径），与 `label` 分开：那个是左栏菜单上的名字。
name: Arc
# 这条链的主线，一句话。f_narrative 只判「在不在主线上」，判据就是这句话（写进 research.md 的 __THESIS__）。
thesis: 稳定币的支付与结算轨：用 USDC 结算、agent 付费、机构资产上链生息
label: Arc
enabled: true
explorer: https://explorer.arc.io
# The chain's own node: LP positions and dev balances are read here, not from an API.
rpc: https://rpc.arc-scan.org
configs:
  - id: default
    label: 默认配置
    enabled: true
    locked: true
    sources: [geckoterminal, radardex, tolly, gmgn, goplus, sourcify]
    schedule:
      interval_hours: 3
      start_hour: 2
      timezone: Asia/Shanghai
      push_delay_minutes: 6
    pipeline:
      scan_limit: 5000
      # blockscout 曾做全链底表（链自己的浏览器索引），按持有人数降序走到这个门槛为止。
      # 它现在不在 scan_sources 里：它的列表接口只给持有人数，市值与流动性全空，
      # 每一行都以「未知」通过上面所有 floor —— 实测把候选池从百余个灌成四千个。
      # 门槛保留着，是为了将来它有市场数据可读时能直接加回来。
      universe_holders_floor: 50
      scan_sources: [gmgn, radardex, tolly, geckoterminal]
      # 判定跑整个幸存者池（0 = 全池）。per-token 读取按主机串行节流，判完百余个要几分钟，
      # 但把名额交给最深的那批更贵：深水里恰好是 LP 未锁 / 陷阱超标 / 深跌的币最多，健
      # 康的币排在后面就永远没被问过。先读完、再用规则裁，规则才拦得住。
      gate_limit: 0
      # 链下调研是本轮唯一烧 token 的一步：过关候选按流动性取前 N 个做调研，0 = 全部调研。
      research_limit: 20
      prefilter:
        # Arc 的真实分布没有中间段：活跃币要么二十万到两百万，要么停在 launchpad
        # 发币时的 5000-9000 U 初始 FDV（85% 的币在此），中间几乎是空的。
        # 口径按 Tolly 全量快照（4,268 个去重币）实测：市值 ≥1 万的有 132 个，
        # 落在 1万-20万 的是 103 个；流动性 ≥1 万的全链只有 68 个，≥5 千的是 710 个。
        # 下限压到 1 万、流动性压到 5 千，是为了不漏掉刚起步的那一批。
        market_cap_min_usd: 10000
        market_cap_max_usd: 200000
        liquidity_min_usd: 5000
        volume_24h_min_usd: 1000
        holders_min: 100
        # 持有人区间：下限以上、上限以下才算合规。上限留空 = 不设上限，缺这个键也等于
        # 不设上限 —— 老快照里没有它，一次升级不该因此开始砍币。
        holders_max: null
        # 空壳淘汰: 市值与流动性同时缺失的行直接淘汰。未知不淘汰是用在「源没回答」
        # 上的，而一个只有地址、没有任何市场数据的行不是没回答，是没有可答的东西。
        # 这一条在代码里是默认开启的，写在这里只是让你在设定页看得见、关得掉：
        # 曾经因为老版本的设置里没有这个键，一轮把四千个空壳行全判成「未知=通过」。
        require_market_data: true
        # 距高回撤：距历史最高点回撤 70% 以上即淘汰。口径是主池的日线全历史高点
        # （GeckoTerminal，池子有多久读多久），这一个读数跌够就淘汰 —— 另一个读数
        # （本项目历轮扫描见过的最高市值）只是下界，本身偏浅，只用来在池面读不到时
        # 报「未判定」，不会单独放行也不会单独拦截。判定分两处：gate 只为自己历史
        # 已判深的那几个币买池面读数（一次问二十个会被 GeckoTerminal 限流），其余
        # 由画卡那一遍判 —— 那一遍本来就要为每个入选币读一次主池，跌够当场淘汰并
        # 顺位补下一个。首见、没有历史的币不算「跌下来的币」，直接通过。
        drawdown_max_pct: -70
        top10_max_pct: 40
        bundling_max_pct: 25
        forbid_honeypot: true
        # 零数据淘汰: how many of the five ranking factors must carry a number once every
        # source has answered. 0 switches the rule off.
        min_scored_fields: 1
      safety:
        require_verified_source: true
        source_verification_mode: dual
        lp_unjudged_passes: true
        # 危险权限只留「真能卷走资产」的三条：隐藏所有者、可改持有人余额、可夺回所有权。
        # mintable / blacklist / pausable / is_proxy 照常读、卡片上照常显示，只是不再当门槛：
        # 发射台币的 mint 权大多在发射台合约手里，当门槛会连带误杀（UBI 就是这么被砍的）。
        forbid_dangerous_perms: [hidden_owner, owner_change_balance, can_take_back_ownership]
        honeypot_max_pct: 45
      scoring:
        onchain_weight: 55
        offchain_weight: 45
        onchain_factors: [liquidity, volume_24h, holders, top10_concentration, bundling]
        onchain_factor_weights:
          liquidity: 20
          volume_24h: 20
          holders: 20
          top10_concentration: 20
          bundling: 20
        offchain_factor_weights:
          f_completeness: 20
          f_substance: 20
          f_team: 20
          f_narrative: 20
          f_community: 20
    report:
      per_round: 5
      push_target: telegram
      push_content: [cards, table]
      rename_count_min: 2
      rename_count: true
      creator_token_count: true
      duplicate_symbol: true
      missing_socials: false
