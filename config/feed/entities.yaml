# 实体词典: 一条新闻"在说谁"的那一半。
#
# 两个用途:
#   1. 模型写 subjects 时的白名单 —— 模型只能从这里挑, 挑不中就当没写 (AIHOT 的 `s in ENTITIES`);
#   2. 没配模型时的兜底分组: 名字按**整词**匹配, 所以 `aliases` 必须是**有辨识度的写法**,
#      `base` / `near` 这种英文常用词不能裸着写进来 —— 否则每条新闻都会粘成一个桶。
#
# 每个字段的意思:
#   id       稳定的英文小写, 出现在数据里, 不随显示名改
#   name     页面上印的写法
#   kind     chain | exchange | protocol | institution | regulator | vc | person | company | org
#   aliases  认它时要找的词 (大小写不敏感, 整词匹配)。中文写法也放这里
#   tickers  代码。只在写 `$XXX` 时命中, 也作为模型抽 subjects 的候选
#
# 加一条就是加一行。词的边界由 matcher 保证, 不需要在这里写正则。

