# 信息流的全局旋钮: 所有源共用的那几个数。
#
# 一个源自己的事写在 sources.yaml 那一行里; 这个文件放的是跨源的那一格 ——「这一轮最多为几篇
# 去抓详情页」不属于任何一个源, 挂在谁身上都别扭。认不出的键让这一轮直接失败, 与 sources.yaml
# 同一个理由: 写在文件里、却被忽略的键, 比一个拼错的键更坏 —— 它看起来设过了。
#
# 每一轮 tick 现读一次: 改了立刻生效, 不用重启 (信息流设定页写的就是它)。

# 出刊节奏: 三种刊各一个北京时间, 到点出的是刚过去的那一期 —— 08:00 的日报讲昨天, 因为窗口
# 是一个完整的日子。留空 = 这一期不出: 一种刊的开关就是它有没有时刻, 不用第二个布尔。
# 周报在周一、月报在 1 日, 那是窗口自己的边界; 这一格只管几点。
schedule:
  day: "08:00"
  week: "08:00"
  month: "08:00"
detail:
  # 每轮最多为几篇去抓详情页。一轮 tick 会一次带进几十条, 而补正文是这一层最贵的一步: 一篇一次
  # 网络往返。没有上限就是「一轮 tick 读四百张网页」。
  maxFetches: 40
  # 正文短于这个字数就算「没有正文」。列表页交出来的 body 是空的, RSS 常常只给一句摘要, 而一句
  # 摘要不是正文 —— 拿它去写摘要, 写出来的还是那一句。
  minBodyChars: 200
  # 单篇详情页的超时。超时就放手: 这条留在库里只有标题, 等下一次补, 不拖住整轮。
  timeoutSeconds: 20
  # 一篇补失败之后, 隔多久才再试它。已经死了的链接不该每轮都敲一次 —— 每轮敲, 预算就被同一批
  # 坏链接吃光, 排在后面的好条目永远轮不到。
  retryHours: 24

# 写作站 (feed/writing.py): 规则版先落库, 模型写好的字再盖上去。这一格是整条流水线上唯一会花钱
# 的一步，所以闸门最多。`maxItems: 0` 就是把它关掉 —— 关掉之后页面照旧，印的是规则版。
llm:
  # 档位: saver | standard | full —— 页面上是「节省 / 标准 / 完整」那个下拉。
  # 一个键管四个站跑哪几档、正文翻译走本地还是模型。为什么不拆成十来个独立开关: 它们互相牵着
  # 走 —— 分组站的入场券是写作站写的 title_zh, 关掉写作站, 分组站一条也排不进来, 热点榜与事件
  # 页跟着空, 最后报刊拿到的是规则版清单。表在 pipeline.PRESETS。
  preset: standard
  # 一轮最多给几条写。一轮 tick 会带进几十条，而没有上限就是「一轮打几百次模型」。
  maxItems: 40
  # 一轮里同时在飞的调用数。免费模型也有每分钟上限，冲太猛就是自己把自己限流。
  concurrency: 4
  # 单条调用的超时。超时就放手：这一条停在上一档，等下一次。
  timeoutSeconds: 60
  # 一条问失败之后，隔多久才再问它。一直问一条写不动的条目，预算就被它吃光。
  retryHours: 24
  # 连着失败这么多次就收手。被限流的时候硬写下去，会把一批条目写成半截 —— 比这一轮什么都没写更坏。
  maxFailures: 3
